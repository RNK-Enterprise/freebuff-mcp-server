name: Dependabot auto-merge

# Auto-merges Dependabot PRs that only contain minor or patch npm updates
# (including the grouped minor+patch npm PR), once all required CI checks pass.
#
# Deliberately NOT covered:
#   - major npm bumps (e.g. zod 3 -> 4) — merged manually after review
#   - github-actions ecosystem bumps (grouped actions majors arrive as
#     semver-major) — merged manually after review
#
# Requires repo settings: "Allow Dependabot to auto-merge" (allow_auto_merge)
# and branch protection on main requiring the two CI checks.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Approve minor/patch npm updates
        if: >-
          contains(github.head_ref, 'github_actions') == false &&
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
           steps.meta.outputs.update-type == 'version-update:semver-patch') &&
          (steps.meta.outputs.group == '' ||
           contains(steps.meta.outputs.group, 'minor'))
        run: |
          gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash)
        if: >-
          contains(github.head_ref, 'github_actions') == false &&
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
           steps.meta.outputs.update-type == 'version-update:semver-patch') &&
          (steps.meta.outputs.group == '' ||
           contains(steps.meta.outputs.group, 'minor'))
        run: |
          gh pr merge --auto --squash "$PR_URL"
          echo "auto-merge enabled for: $PR_URL (update-type=${{ steps.meta.outputs.update-type }}, group=${{ steps.meta.outputs.group }})"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
