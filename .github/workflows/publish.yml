name: Publish to npm

# Publishes freebuff-mcp-server when a GitHub release is published, and can be
# re-run manually (workflow_dispatch) against the tag of an existing release.
#
# Authentication, in npm's detection order (npm tries OIDC first):
#   1. npm trusted publishing (OIDC) — no secret required. Once a trusted
#      publisher is configured for this repo on npmjs.com, publishes are
#      tokenless and provenance is generated automatically.
#   2. A repository secret NPM_TOKEN (npm automation/granular token), used as
#      a fallback when no trusted publisher is configured.
#
# Two publish routes:
#   - direct: npm publish (default, used for the very first release)
#   - staged: npm stage publish, which parks the version in npm's staging area
#     for a maintainer to approve with 2FA before it goes public. Selected by
#     the `staging` workflow_dispatch input. A staged publish cannot bootstrap
#     a brand-new package name; see docs/publishing.md.
#
# Node 24 is used because trusted publishing requires npm CLI >= 11.5.1 and
# staged publishing requires >= 11.15.0, while Node >= 22.14 is required by
# both. Node 24.21 ships npm 11.19.0; Node 22 ships 10.9.8, which is too old.
#
# The release tag must match the package version (v0.3.0 or 0.3.0).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      staging:
        description: 'Submit to the npm staging area for 2FA approval instead of publishing directly'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # never cache on release builds
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build
        run: |
          npm run typecheck
          npm run build

      - name: Smoke test (protocol-only)
        run: npm test
        env:
          SMOKE_SKIP_NETWORK: '1'
          FREEBUFF_MCP_DIR: ${{ runner.temp }}/freebuff-mcp-sessions

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package version: ${PKG_VERSION}, release tag: ${GITHUB_REF_NAME} (${TAG_VERSION})"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::package.json version (${PKG_VERSION}) does not match release tag (${GITHUB_REF_NAME}). Bump package.json and re-release. (A manual run must target the release tag, e.g. --ref v${PKG_VERSION}.)"
            exit 1
          fi

      - name: Report publish credentials
        run: |
          echo "npm: $(npm --version), node: $(node --version)"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Using the NPM_TOKEN repository secret."
          else
            echo "No NPM_TOKEN secret set — relying on npm trusted publishing (OIDC)."
            echo "This requires a trusted publisher configured for ${GITHUB_REPOSITORY} (workflow publish.yml) on npmjs.com."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: |
          if [ "${{ inputs.staging }}" = "true" ]; then
            required="11.15.0"
            have="$(npm --version)"
            if [ "$(printf '%s\n%s\n' "$required" "$have" | sort -V | head -1)" != "$required" ]; then
              echo "::error::npm ${have} is too old for staged publishing (needs >= ${required}). The job runs Node 24 (npm 11.19+); check the setup-node version."
              exit 1
            fi
            version="$(node -p "require('./package.json').version")"
            echo "Staging freebuff-mcp-server@${version} for maintainer approval"
            npm stage publish
            {
              echo "### Staged for approval"
              echo ""
              echo "\`freebuff-mcp-server@${version}\` is in npm's staging area (npm ${have}). Approve it with 2FA:"
              echo ""
              echo '```bash'
              echo "npm stage list                 # find the stage-id"
              echo "npm stage view <stage-id>      # inspect metadata"
              echo "npm stage download <stage-id>  # fetch the tarball"
              echo "npm stage approve <stage-id>   # publish (2FA prompt)"
              echo '```'
              echo ""
              echo "Or approve it at npmjs.com → Packages → Staged Packages."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
