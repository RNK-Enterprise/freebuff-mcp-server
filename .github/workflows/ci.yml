name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Typecheck, build & smoke test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Fails on any runtime-scope vulnerability — the undici /
        # @ai-sdk/provider-utils class of regression that reached us through
        # @codebuff/sdk. Dev-only advisories do not fail the build; raise the
        # bar with AUDIT_MIN_SEVERITY=high.
        run: npm run audit:runtime

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test (protocol-only; no credentials on CI)
        run: npm test
        env:
          SMOKE_SKIP_NETWORK: '1'
          FREEBUFF_MCP_DIR: ${{ runner.temp }}/freebuff-mcp-sessions
