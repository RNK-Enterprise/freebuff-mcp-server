name: CI

on:
  push:
    branches: [main]
    paths:
      - 'freebuff-mcp/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'freebuff-mcp/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Typecheck, build & smoke test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: freebuff-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: freebuff-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test (protocol-only; no credentials on CI)
        run: npm test
        env:
          SMOKE_SKIP_NETWORK: '1'
          FREEBUFF_MCP_DIR: ${{ runner.temp }}/freebuff-mcp-sessions
